<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto 04 - Formulários</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body style="background-color: rgb(163, 163, 163);">
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow-sm p-4">
                    <div class="text-center">
                    <img src="assistencia-tecnica-300x300-4n580cs7wb.webp" width="80" height="80" class="rounded-circle object-fit-cover mb-3 border border-3" alt="Foto">
                    </div>
                    <h3 class="mb-4 text-center">Cadastro de Atendimento</h3>
                    <form>
                        <div class="row g-3">
                            <div class="col-sm-6">
                                <label class="form-label">Nome</label>
                                <input type="text" class="form-control" required>
                            </div>

                            <div class="col-sm-6">
                                <label class="form-label">Sobrenome</label>
                                <input type="text" class="form-control" required>
                            </div>

                            <div class="col-12">
                                <label for="observacoes" class="form-label">Observações</label>
                                <textarea id="observacoes" class="form-control" rows="3" placeholder="Ex: Não liga, tela quebrada, superaquecendo..."></textarea>
                            </div>

                            <div class="col-12">
                                <label class="form-label">Telefone</label>
                                <div class="input-group">
                                    <span class="input-group-text">+55</span>
                                    <input type="tel" class="form-control" placeholder="41999999999" maxlength="11" oninput="this.value = this.value.replace(/\D/g, '')" required>
                                </div>
                            </div>
                            

                            <div class="col-12">
                                <label class="form-label">Tipo de serviço</label>
                                <select class="form-select">
                                    <option selected>Escolha um opção ...</option>
                                    <option value="1">Formatação e Sistema</option>
                                    <option value="2">Limpeza Interna</option>
                                    <option value="3">Troca de Tela / Bateria</option>
                                    <option value="4">Reparo em Placa</option>
                                    <option value="5">Orçamento / Diagnóstico</option>
                                </select>
                            </div>

                            <div class="col-12">
                                <div class="form-check">
                                    <input type="checkbox" id="termos" class="form-check-input">
                                    <label for="termos" class="form-check-label">
                                        Autorizo o serviço e assumo responsabilidade pelos dados
                                    </label>
                                </div>
                            </div>

                            <div class="col-12 mt-4">
                                <button class="btn w-100" style="background-color: rgb(236, 222, 14);" type="submit">Finalizar Cadastro</button>
                            </div>

                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    
</body>
</html>
