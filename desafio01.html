<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto 01 - Cartão de Perfil</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body style="background-color: #e2bd96;">
    <div class="container mt-5">
        <div class="card mx-auto shadow-sm" style="max-width: 450px;">
            <div class="card-body text-center p-4">
                <img src="14e397c2-f78a-452d-95e5-573483a852c6.png" width="120" height="120" class="rounded-circle object-fit-cover mb-3 border border-3 border-warning" alt="Foto">
                <h3 class="card-title fw-bold">Nina Costa</h3>
                <p class="text-muted mb-3">Consultoria de TI</p>
                <p class="card-text">Ajudo empresas a cortarem gastos tecnológicos e operarem com máxima segurança e eficiência.</p>
                <div class="d-grid gap-2">
                    <a href="#" class="btn btn-success">WhatsApp</a>
                    <a href="#" class="btn text-white border-0" style="background: linear-gradient(45deg, #f09433, #dc2743, #bc1888);">Instagram</a>
                    <a href="#" class="btn btn-primary">LinkedIn</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
